<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- Redirect otomatis via HTML (Metode Utama) -->
    <meta http-equiv="refresh" content="0; url=https://firmanlutfif00-oss.github.io/feed/">
    
    <script>
        // Redirect via JavaScript (Cadangan jika HTML meta lambat)
        window.location.href = "https://firmanlutfif00-oss.github.io/feed/";
    </script>
</head>
<body>
    <!-- Pesan alternatif jika browser memblokir pengalihan otomatis -->
    <p>Jika halaman tidak berpindah otomatis, <a href="https://firmanlutfif00-oss.github.io/feed/">klik di sini</a>.</p>
</body>
</html>
